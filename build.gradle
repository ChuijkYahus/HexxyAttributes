plugins {
	id 'fabric-loom' version '1.7-SNAPSHOT'
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "1.7.10"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	flatDir {
		dir 'libs'
	}

	maven {
		name = 'BlameJared Maven'
		url = 'https://maven.blamejared.com'
	}
	maven { url "https://maven.shedaniel.me/" }
	maven {
		name = "Ladysnake Mods"
		url = 'https://maven.ladysnake.org/releases'
	}
	maven {
		name "entity reach"
		url "https://maven.jamieswhiteshirt.com/libs-release/"
	}
	maven { url "https://mvn.devos.one/snapshots/" }
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
	maven {
		url = "https://jitpack.io"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"hexxyorigins" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	modImplementation("net.fabricmc:fabric-language-kotlin:$fabric_language_kotlin_version")

	modImplementation "at.petra-k.paucal:paucal-fabric-$minecraft_version:$paucal_version"
	modImplementation("at.petra-k.hexcasting:hexcasting-fabric-$minecraft_version:$hexcasting_version") {
		exclude module: "phosphor"
	}
	modImplementation "vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-FABRIC-SNAPSHOT"
	
	modImplementation "dev.onyxstudios.cardinal-components-api:cardinal-components-api:$cardinal_components_version"
	include "dev.onyxstudios.cardinal-components-api:cardinal-components-api:$cardinal_components_version"

	// I really don't like to do that, but i didn't find any other way.
	// Stole the file from HexMod github
	modImplementation "hexxyorigins:serialization-hooks:$serialization_hooks_version"
	include "hexxyorigins:serialization-hooks:$serialization_hooks_version"

	modImplementation("me.shedaniel.cloth:cloth-config-fabric:$cloth_config_version") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	modImplementation "com.github.apace100:origins-fabric:v${project.origins_version}"
	modImplementation "com.github.apace100:calio:${project.calio_version}"

	modImplementation "io.github.apace100:apoli:${project.apoli_version}"
	include "io.github.apace100:apoli:${project.apoli_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}